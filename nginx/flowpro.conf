# Live config for flowpro.dev, as deployed in the reverse-proxy container.
#
# On the server this file is /srv/infrastructure/nginx/conf.d/flowpro.conf,
# mounted into the nginx:1.25 container "reverse-proxy" at /etc/nginx/conf.d/.
# The GitHub Actions deploy copies public/ only, so a change here has to be
# applied by hand:
#
#   scp nginx/flowpro.conf ubuntu@146.59.92.14:/tmp/
#   ssh ubuntu@146.59.92.14 'cp /tmp/flowpro.conf /srv/infrastructure/nginx/conf.d/flowpro.conf #     && docker exec reverse-proxy nginx -t && docker exec reverse-proxy nginx -s reload'

server {
    listen 80;
    server_name flowpro.dev www.flowpro.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://flowpro.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.flowpro.dev;

    ssl_certificate     /etc/letsencrypt/live/flowpro.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowpro.dev/privkey.pem;

    return 301 https://flowpro.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name flowpro.dev;

    ssl_certificate     /etc/letsencrypt/live/flowpro.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowpro.dev/privkey.pem;

    root /srv/apps/flowpro-dev;
    index index.html;

    # A missing path must 404, not fall back to the home page: a soft 404
    # puts a wrong copy of the home page in AI and search indexes under every
    # mistyped URL.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml image/png;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
