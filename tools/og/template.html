<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  /* Tokens copied from the site; do not diverge from them. */
  :root { --blue: #2563EB; --navy: #0B1120; --muted: #94A3B8; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: var(--navy);
    padding: 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 14px; color: #fff; font-size: 34px; font-weight: 900; letter-spacing: -.03em; }
  .logo em { color: var(--blue); font-style: normal; }
  h1 { margin-top: 56px; color: #fff; font-size: 76px; font-weight: 900; letter-spacing: -.04em; line-height: 1.04; }
  p { margin-top: 30px; color: var(--muted); font-size: 26px; line-height: 1.5; max-width: 900px; }
  .foot { color: #475569; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
  <div>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 20" width="34" height="24" aria-hidden="true"><rect width="28" height="5" rx="2.5" fill="#2563EB"/><rect y="7.5" width="21" height="5" rx="2.5" fill="#2563EB"/><rect y="15" width="14" height="5" rx="2.5" fill="#2563EB"/></svg>
      <span>Flow<em>Pro</em></span>
    </div>
    <h1 id="headline"></h1>
    <p id="sub"></p>
  </div>
  <div class="foot">flowpro.dev</div>
</body>
</html>
